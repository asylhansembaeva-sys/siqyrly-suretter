function hideOne(){if(mode!=='ready')return;let options=[0,1,2,3,4,5].filter(x=>x!==used[stage]);let preferred=(stage+round[stage])%6;hidden=options.includes(preferred)?preferred:options[Math.floor(Math.random()*options.length)];used[stage]=hidden;round[stage]++;mode='hidden';draw()}
